<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주소 다리</title>
<style>html,body{margin:0;height:100%;background:#fff;font-family:system-ui,sans-serif}#box{position:absolute;inset:0}#msg{padding:24px;text-align:center;color:#6b7d77;font-size:14px}</style>
</head><body><div id="box"><div id="msg">주소 찾는 화면을 여는 중이에요…</div></div>
<script>
// 사명수첩 주소 다리: 카카오(다음) 우편번호 찾기를 https 에서 열고, 고른 주소를 앱으로 넘겨줘요.
// 주소만 주고받고, 다른 정보는 저장하지 않아요.
(function(){
var q='';try{q=new URLSearchParams(location.search).get('q')||'';}catch(e){}
function send(o){o.t='samAddr';try{(window.parent!==window?window.parent:window.opener).postMessage(o,'*');}catch(e){}}
var s=document.createElement('script');s.src='https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
s.onload=function(){var box=document.getElementById('box');box.innerHTML='';
new daum.Postcode({width:'100%',height:'100%',
oncomplete:function(d){send({road:d.roadAddress||'',jibun:d.jibunAddress||d.autoJibunAddress||'',addr:d.address||'',bname:d.buildingName||'',zonecode:d.zonecode||'',type:d.userSelectedType||''});}
}).embed(box,{q:q,autoClose:false});send({ready:1});};
s.onerror=function(){document.getElementById('msg').textContent='인터넷이 안 돼서 열지 못했어요';send({fail:1});};
document.head.appendChild(s);
})();
</script></body></html>
